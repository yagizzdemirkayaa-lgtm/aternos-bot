name: Aternos 7/24 Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Kodlari Cek
      uses: actions/checkout@v4

    - name: Node.js Kur
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Gerekli Modulleri Yukle
      run: npm install mineflayer

    - name: Botu Baslat
      run: node bot.js
